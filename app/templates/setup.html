<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعداد الاتصال - نظام تنظيم المرضى</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="setup-container">
        <div class="setup-card">
            <div class="setup-header">
                <h1>إعداد اتصال قاعدة البيانات</h1>
                <p>أدخل بيانات الاتصال بسيرفر SQL Server</p>
            </div>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success">{{ success }}</div>
            {% endif %}

            <form method="POST" action="/setup" class="setup-form">
                <div class="form-group">
                    <label for="server">اسم السيرفر (Server Name)</label>
                    <input type="text" id="server" name="server" required
                           placeholder="مثال: 192.168.1.100 أو SERVERNAME\\SQLEXPRESS">
                </div>

                <div class="form-group">
                    <label for="username">اسم المستخدم (Username)</label>
                    <input type="text" id="username" name="username" required
                           placeholder="مثال: sa">
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور (Password)</label>
                    <input type="password" id="password" name="password" required
                           placeholder="أدخل كلمة المرور">
                </div>

                <div class="form-group">
                    <label>قاعدة البيانات</label>
                    <input type="text" value="hospimag" disabled class="disabled-input">
                </div>

                <button type="submit" class="btn btn-primary">
                    اختبار الاتصال وحفظ الإعدادات
                </button>
            </form>
        </div>
    </div>
</body>
</html>
